name: Terraform CI (Dev)

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubTerraformOIDCRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color > plan.txt
        env:
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}

      - name: Extract Plan Summary
        id: summary
        run: |
          echo "summary=$(grep -E 'Plan:|No changes' plan.txt || echo 'No changes detected.')" >> "$GITHUB_OUTPUT"

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true

      - name: Comment PR with Plan Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Terraform Plan Summary**\n\`\`\`\n${{ steps.summary.outputs.summary }}\n\`\`\`\n📦 Full plan saved as GitHub artifact.`
            })

      - name: Upload Terraform Plan as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tf-plan
          path: plan.txt
